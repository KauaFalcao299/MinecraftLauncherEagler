  <div class="bedrock-page">
    <div class="bedrock-logo">
      <img src="./minecraft-bedrock.svg" alt="Minecraft Bedrock Edition">
    </div>

    <div class="bedrock-playbar" id="bedrock-playbar" style="bottom: 42px;">
      <button class="bedrock-button disabled" id="bedrock-button" type="button" aria-label="Not compatible" onclick="handleBedrockClick()" style="width: 370px;">
        <img id="bedrock-btn-img" src="./not compatible.png" alt="Play">
      </button>
      <div class="coin">
        <img src="./coin.png" alt="Coin">
      </div>
    </div>

    <div class="alert-bar" id="alert-bar" style="display: flex;">
      <span class="icon">⚠</span>
      <span id="alert-text">Minecraft Bedrock Edition isn't compatible with this launcher</span>
    </div>
  </div>

  <script>
    let clickCount = 0;
    let buttonDisabled = false;
    let timer1, timer2;

    function showErrorBar(message) {
      document.getElementById('alert-text').textContent = message;
      document.getElementById('alert-bar').style.display = 'flex';
      document.getElementById('bedrock-playbar').style.bottom = '42px';
    }

    function disableButton() {
      const btn = document.getElementById('bedrock-button');
      btn.classList.add('disabled');
      btn.style.width = '370px';
      document.getElementById('bedrock-btn-img').src = '/images/not compatible.png';
      btn.setAttribute('aria-label', 'Not compatible');
      buttonDisabled = true;
    }

    function handleBedrockClick() {
      if (buttonDisabled) return;
      clickCount++;

      if (clickCount === 1) {
        showErrorBar("Uh oh! An error occurred while trying to launch Minecraft Bedrock Edition, please try again later.");
        return;
      }

      disableButton();
      showErrorBar("Minecraft Bedrock Edition isn't compatible with this launcher");
      clearTimeout(timer1);
      clearTimeout(timer2);
    }

    timer1 = setTimeout(() => {
      if (clickCount === 0) {
        disableButton();
      }
    }, 10000);

    timer2 = setTimeout(() => {
      if (clickCount === 0) {
        showErrorBar("Minecraft Bedrock Edition isn't compatible with this launcher");
      }
    }, 15000);
  </script>

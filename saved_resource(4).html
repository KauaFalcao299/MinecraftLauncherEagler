<div class="bg" style="background-image: url(&quot;/images/background/26.2.png&quot;);">
  <img class="minecraft-java-logo" src="./minecraft-java.png" alt="Minecraft Java Edition" style="display: block;">
</div>

<script>
  const backgrounds = {
    "1.13.2": "/images/background/1.13.png",
    "1.14.4": "/images/background/1.14.png",
    "1.16.5": "/images/background/1.16.png",
    "1.17.1": "/images/background/1.17.png",
    "1.20.6": "/images/background/1.20.png",
    "1.21.11": "/images/background/1.21.11.png",
    "26.1.2": "/images/background/26.1.png",
    "26.2": "/images/background/26.2.png",
  };
  function updateBackground() {
    const selected = JSON.parse(sessionStorage.selectedInstance || "null");
    const background = selected && (backgrounds[selected.versionID] || (selected.version === "1.20" && backgrounds["1.20.6"])) || "/images/wallpaper.png";
    const hasCustomLogo = Boolean(selected && backgrounds[selected.versionID] && selected.versionID !== "1.20.6" && selected.version !== "1.20");
    document.querySelector(".minecraft-java-logo").style.display = hasCustomLogo ? "block" : "none";
    document.querySelector(".bg").style.backgroundImage = `url("${background}")`;
    try {
      const launcherWallpaper = window.parent.document.getElementById("minecraft-wallpaper");
      const launcherContainer = window.parent.document.querySelector(".wallpaper-container");
      if (launcherWallpaper) launcherWallpaper.src = background;
      if (launcherContainer) {
        let launcherLogo = launcherContainer.querySelector("#play-page-minecraft-logo");
        if (!launcherLogo) {
          launcherLogo = window.parent.document.createElement("img");
          launcherLogo.id = "play-page-minecraft-logo";
          launcherLogo.src = "/images/background/minecraft-java.png";
          launcherLogo.alt = "Minecraft Java Edition";
          Object.assign(launcherLogo.style, {
            position: "absolute",
            top: "18px",
            left: "50%",
            width: "360px",
            height: "auto",
            transform: "translateX(-50%)",
            zIndex: "1",
            pointerEvents: "none",
          });
          launcherContainer.appendChild(launcherLogo);
        }
        const otherMenuVisible = Array.from(window.parent.document.querySelectorAll(".iframePage"))
          .some((page) => page.id !== "play" && page.style.display !== "none");
        launcherLogo.style.display = otherMenuVisible || !hasCustomLogo ? "none" : "block";
      }
    } catch (error) {
    }
  }
  updateBackground();
  setInterval(updateBackground, 250);
</script>
